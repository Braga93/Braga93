name: Atualizar gráficos do perfil

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/gerar_graficos.py"
      - ".github/workflows/atualizar_graficos.yml"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar os gráficos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/gerar_graficos.py

      - name: Publicar no branch graficos
        run: |
          mkdir -p "$RUNNER_TEMP/graficos"
          cp assets/*.svg "$RUNNER_TEMP/graficos/"
          cd "$RUNNER_TEMP/graficos"
          git init -q -b graficos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Gráficos do perfil"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" graficos
